import os
from supabase import create_client, Client

# Obtener las credenciales de Supabase desde las variables de entorno de GitHub Actions
url: str = os.environ.get("SUPABASE_URL")
key: str = os.environ.get("SUPABASE_KEY")

# Inicializar el cliente de Supabase
supabase: Client = create_client(url, key)

# Datos de prueba para verificar que se guarden en Supabase
data = {
    "nombre": "Producto Prueba Walmart",
    "precio": 99.50
}

try:
    # Insertar en la tabla productos_walmart
    response = supabase.table("productos_walmart").insert(data).execute()
    print("¡Datos insertados con éxito en Supabase!", response)
except Exception as e:
    print("Error al insertar los datos:", e)
